<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHACHA ELECTRON</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

#storePage{
display:none;
}

.auth-container{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#003366,#0077ff);
padding:20px;
}

.auth-box{
background:white;
width:450px;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.auth-box h1{
text-align:center;
color:#003366;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
background:#0077ff;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0056cc;
}

#passwordStrength{
font-weight:bold;
margin-bottom:10px;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.search-bar{
padding:20px;
text-align:center;
}

.search-bar input{
width:90%;
max-width:600px;
}

.categories{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:20px;
}

.categories button{
width:auto;
padding:10px 20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
}

.product-content{
padding:15px;
text-align:center;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.cart{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:20px;
}

footer a{
color:white;
margin:10px;
text-decoration:none;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
text-decoration:none;
}

</style>
</head>

<body>

<div id="authContainer" class="auth-container">

<div class="auth-box">

<h1>CHACHA ELECTRON</h1>

<h3>Registration</h3>

<input id="fullname" placeholder="Full Names">

<input id="idnumber" placeholder="ID Number">

<input id="phone" placeholder="Phone Number">

<input id="county" placeholder="County">

<input id="town" placeholder="Town">

<input id="estate" placeholder="Estate">

<input id="landmark" placeholder="Landmark">

<input
type="password"
id="password"
placeholder="Strong Password">

<div id="passwordStrength"></div>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button onclick="registerUser()">
Register
</button>

<hr style="margin:20px 0">

<h3>Login</h3>

<input
id="loginId"
placeholder="ID Number">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button onclick="loginUser()">
Login
</button>

</div>

</div>

<div id="storePage">

<header>
<h1>CHACHA ELECTRON</h1>
<p>Electronics Store</p>
</header>

<div class="search-bar">

<input
type="text"
id="search"
placeholder="Search products..."
onkeyup="searchProducts()">

</div>

<div class="categories">

<button onclick="filterCategory('all')">
All
</button>

<button onclick="filterCategory('phones')">
Phones
</button>

<button onclick="filterCategory('laptops')">
Laptops
</button>

<button onclick="filterCategory('tv')">
TV
</button>

<button onclick="filterCategory('gaming')">
Gaming
</button>

</div>

<div class="products">

<div class="product phones">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800">
<div class="product-content">
<h3>Samsung Galaxy</h3>
<div class="price">KES 25000</div>
<button onclick="addToCart('Samsung Galaxy',25000)">
Add To Cart
</button>
</div>
</div>

<div class="product laptops">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800">
<div class="product-content">
<h3>HP Laptop</h3>
<div class="price">KES 65000</div>
<button onclick="addToCart('HP Laptop',65000)">
Add To Cart
</button>
</div>
</div>

<div class="product tv">
<img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?w=800">
<div class="product-content">
<h3>Smart TV</h3>
<div class="price">KES 45000</div>
<button onclick="addToCart('Smart TV',45000)">
Add To Cart
</button>
</div>
</div>

<div class="product gaming">
<img src="https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=800">
<div class="product-content">
<h3>PlayStation 5</h3>
<div class="price">KES 85000</div>
<button onclick="addToCart('PS5',85000)">
Add To Cart
</button>
</div>
</div>

</div>

<div class="cart">

<h2>
Cart (<span id="count">0</span>)
</h2>

<ul id="cartItems"></ul>

<h3>
Total: KES <span id="total">0</span>
</h3>

<button onclick="checkout()">
Checkout via M-Pesa
</button>

</div>

<footer>

<h3>CHACHA ELECTRON</h3>

<p>Business Number: 0799446312</p>

<a href="tel:0799446312">
📞 Call
</a>

<a href="sms:0799446312">
📩 SMS
</a>

<a
href="https://wa.me/254799446312"
target="_blank">
💬 WhatsApp
</a>

</footer>

</div>

<a
class="whatsapp"
href="https://wa.me/254799446312"
target="_blank">
💬
</a>

<script>

const passwordInput =
document.getElementById("password");

passwordInput.addEventListener(
"keyup",
checkStrength
);

function checkStrength(){

const password =
passwordInput.value;

let strength=0;

if(password.length>=8) strength++;
if(/[A-Z]/.test(password)) strength++;
if(/[a-z]/.test(password)) strength++;
if(/[0-9]/.test(password)) strength++;
if(/[!@#$%^&*]/.test(password)) strength++;

const box =
document.getElementById(
"passwordStrength"
);

if(strength<5){

box.innerHTML =
"🔴 Weak Password";

box.style.color="red";

}else{

box.innerHTML =
"🟢 Strong Password";

box.style.color="green";

}

}

function registerUser(){

const strong =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

let password =
document.getElementById(
"password"
).value;

let confirm =
document.getElementById(
"confirmPassword"
).value;

if(!strong.test(password)){

alert(
"Password must contain uppercase, lowercase, number and special character."
);

return;

}

if(password!==confirm){

alert(
"Passwords do not match."
);

return;

}

localStorage.setItem(
"id",
document.getElementById(
"idnumber"
).value
);

localStorage.setItem(
"pass",
password
);

alert(
"Registration successful."
);

}

function loginUser(){

if(
document.getElementById("loginId")
.value===localStorage.getItem("id")
&&
document.getElementById(
"loginPassword"
).value===localStorage.getItem("pass")
){

document.getElementById(
"authContainer"
).style.display="none";

document.getElementById(
"storePage"
).style.display="block";

}else{

alert("Invalid login");

}

}

let total=0;
let count=0;

function addToCart(name,price){

count++;
total+=price;

document.getElementById(
"count"
).innerHTML=count;

document.getElementById(
"total"
).innerHTML=total;

let li=
document.createElement("li");

li.innerHTML=
name+" - KES "+price;

document.getElementById(
"cartItems"
).appendChild(li);

}

function searchProducts(){

let search=
document.getElementById("search")
.value.toLowerCase();

document
.querySelectorAll(".product")
.forEach(product=>{

let title=
product.querySelector("h3")
.innerText.toLowerCase();

product.style.display=
title.includes(search)
? "block"
: "none";

});

}

function filterCategory(category){

document
.querySelectorAll(".product")
.forEach(product=>{

if(
category==="all" ||
product.classList.contains(category)
){

product.style.display="block";

}else{

product.style.display="none";

}

});

}

function checkout(){

alert(

"CHACHA ELECTRON\n\n"+
"Amount: KES "+total+
"\n\n"+
"Use M-Pesa Number:\n"+
"0799446312\n\n"+
"For real automatic STK Push, connect your Daraja API backend."

);

window.open(
"https://wa.me/254799446312",
"_blank"
);

}

</script>

</body>
</html>
