<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHACHA ELECTRON</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
max-width:500px;
margin:30px auto;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:5px;
}

button{
padding:12px;
border:none;
background:#0066ff;
color:white;
cursor:pointer;
border-radius:5px;
width:100%;
}

button:hover{
background:#0044cc;
}

#store{
display:none;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.product{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}

.price{
color:green;
font-weight:bold;
font-size:20px;
margin:10px 0;
}

.cart{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

.category{
margin-top:15px;
}

.contact{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

.contact a{
color:#25D366;
margin:10px;
text-decoration:none;
}

#strength{
font-weight:bold;
}

.search{
padding:15px;
background:white;
margin-top:10px;
border-radius:10px;
}

.forgot{
color:#0066ff;
cursor:pointer;
display:block;
margin-top:10px;
}
</style>
</head>
<body>

<header>
<h1>CHACHA ELECTRON</h1>
<p>Electronics Store - East Africa</p>
</header>

<div id="auth">

<div class="card">

<h2>Create Account</h2>

<input type="text" id="fullname" placeholder="Full Names">

<input type="text" id="idnumber" placeholder="ID Number">

<input type="email" id="email" placeholder="Email Address">

<input type="text" id="phone" placeholder="Phone Number">

<select id="country">
<option value="">Select Country</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Tanzania</option>
<option>Rwanda</option>
<option>Burundi</option>
<option>South Sudan</option>
<option>Ethiopia</option>
<option>Somalia</option>
<option>Djibouti</option>
<option>Eritrea</option>
</select>

<input type="text" id="county" placeholder="County / State">

<input type="text" id="town" placeholder="Town / City">

<input type="password" id="password" placeholder="Password">

<div id="strength"></div>

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button onclick="registerUser()">Register</button>

<hr style="margin:20px 0">

<h2>Login</h2>

<input type="text" id="loginId" placeholder="ID Number">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="loginUser()">Login</button>

<span class="forgot" onclick="forgotPassword()">
Forgot Password?
</span>

</div>

</div>

<div id="store">

<div class="container">

<div class="search">

<input
type="text"
id="search"
placeholder="Search products..."
onkeyup="searchProducts()">

</div>

<div class="category">

<select id="categoryFilter" onchange="filterProducts()">

<option value="all">All Categories</option>

<option value="phone">Phones</option>

<option value="laptop">Laptops</option>

<option value="tv">TVs</option>

<option value="headphone">Headphones</option>

<option value="earphone">Earphones</option>

<option value="cable">Cables</option>

</select>

</div>

<div class="products" id="products"></div>

<div class="cart">

<h2>Shopping Cart</h2>

<ul id="cartItems"></ul>

<h3>Total: KES <span id="total">0</span></h3>

<button onclick="checkout()">
Pay With M-Pesa
</button>

</div>

</div>

<div class="contact">

<h2>CHACHA ELECTRON</h2>

<p>M-Pesa Number: 0799446312</p>

<a href="tel:0799446312">📞 Call</a>

<a href="sms:0799446312">📩 SMS</a>

<a href="https://wa.me/254799446312" target="_blank">
💬 WhatsApp
</a>

</div>

</div>

<script>

let total = 0;

let products = [

{
name:"Samsung Galaxy S24 Ultra",
category:"phone",
price:185000,
img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800"
},

{
name:"iPhone 15 Pro Max",
category:"phone",
price:215000,
img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800"
},

{
name:"HP EliteBook",
category:"laptop",
price:95000,
img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800"
},

{
name:"Dell Latitude",
category:"laptop",
price:85000,
img:"https://images.unsplash.com/photo-1517336714739-489689fd1ca8?w=800"
},

{
name:"Samsung 55 Smart TV",
category:"tv",
price:92000,
img:"https://images.unsplash.com/photo-1593784991095-a205069470b6?w=800"
},

{
name:"LG OLED TV",
category:"tv",
price:150000,
img:"https://images.unsplash.com/photo-1461151304267-38535e780c79?w=800"
},

{
name:"Sony WH-1000XM5",
category:"headphone",
price:45000,
img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800"
},

{
name:"Apple AirPods Pro",
category:"earphone",
price:32000,
img:"https://images.unsplash.com/photo-1606220838315-056192d5e927?w=800"
},

{
name:"HDMI Cable 5M",
category:"cable",
price:1200,
img:"https://images.unsplash.com/photo-1580894908361-967195033215?w=800"
}

];

function renderProducts(list){

let html="";

list.forEach(product=>{

html += `
<div class="product">

<img src="${product.img}">

<h3>${product.name}</h3>

<p class="price">
KES ${product.price.toLocaleString()}
</p>

<button onclick="
addToCart('${product.name}',
${product.price})">
Add To Cart
</button>

</div>
`;

});

document.getElementById("products").innerHTML=html;

}

renderProducts(products);

document.getElementById("password")
.addEventListener("keyup",function(){

let value=this.value;

const strong =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

document.getElementById("strength")
.innerHTML =
strong.test(value)
?
"🟢 Strong Password"
:
"🔴 Weak Password";

});

function registerUser(){

const strong =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

let password=
document.getElementById("password").value;

let confirm=
document.getElementById("confirmPassword").value;

if(!strong.test(password)){
alert("Use a strong password.");
return;
}

if(password!==confirm){
alert("Passwords do not match.");
return;
}

localStorage.setItem(
"userId",
document.getElementById("idnumber").value
);

localStorage.setItem(
"userPassword",
password
);

alert("Registration successful.");

}

function loginUser(){

let id=
document.getElementById("loginId").value;

let pass=
document.getElementById("loginPassword").value;

if(
id===localStorage.getItem("userId")
&&
pass===localStorage.getItem("userPassword")
){

document.getElementById("auth").style.display="none";
document.getElementById("store").style.display="block";

}else{
alert("Invalid login");
}

}

function forgotPassword(){

let newPassword =
prompt(
"Enter your new password"
);

if(newPassword){

localStorage.setItem(
"userPassword",
newPassword
);

alert(
"Password reset successfully."
);

}

}

function addToCart(name,price){

let li =
document.createElement("li");

li.innerHTML =
name+" - KES "+price;

document.getElementById("cartItems")
.appendChild(li);

total += price;

document.getElementById("total")
.innerHTML =
total.toLocaleString();

}

function checkout(){

alert(
"CHACHA ELECTRON\n\n"+
"Send Payment To:\n"+
"0799446312\n\n"+
"Amount: KES "+
total.toLocaleString()
);

window.open(
"https://wa.me/254799446312",
"_blank"
);

}

function searchProducts(){

let search =
document.getElementById("search")
.value.toLowerCase();

let filtered =
products.filter(p=>
p.name.toLowerCase()
.includes(search)
);

renderProducts(filtered);

}

function filterProducts(){

let cat=
document.getElementById(
"categoryFilter"
).value;

if(cat==="all"){
renderProducts(products);
return;
}

renderProducts(
products.filter(
p=>p.category===cat
)
);

}

</script>

</body>
</html>
